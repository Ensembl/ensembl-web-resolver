name: Run Tests on PR

on:
  pull_request:
    branches: [ "main" ]  # Runs when PR targets 'main'
    types: [opened, synchronize]  # Runs when PR is opened or updated

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Check out the repository

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        env:
          PIP_EXTRA_INDEX_URL: https://${{ secrets.GITLAB_USER }}:${{ secrets.GITLAB_TOKEN }}@gitlab.ebi.ac.uk/api/v4/projects/6228/packages/pypi/simple
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          cp sample-env app/.env
          pytest
