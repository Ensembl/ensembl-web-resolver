# Stages for the CI/CD job
stages:
  - setup
  - test
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_IMAGE: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
  BASE: ensembl-k8s-manifests/ensembl-web-resolver
  NFS_SERVER: ${HL_NFS_SERVER_CODON}
  NFS_PATH: ${HL_NFS_PATH_CODON}

# Template to build docker image
.build:
  stage: build
  image: docker
  services:
    - docker:dind
  variables:
    # Required for `docker build --secret`; prevents the token entering image layers.
    DOCKER_BUILDKIT: "1"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --build-arg GITLAB_USER=gitlab-ci-token --secret id=gitlab_token,env=CI_JOB_TOKEN -t ${DOCKER_IMAGE} --no-cache -f Dockerfile .
    - docker push ${DOCKER_IMAGE}
    # remove local image from shared runner
    - docker rmi ${DOCKER_IMAGE}
    - docker logout $CI_REGISTRY

  rules:
    - if: "$CI_DEPLOY_FREEZE == null"

.deploy:
  stage: deploy
  image: dockerhub.ebi.ac.uk/ensembl-web/deploy-tools:latest
  before_script:
    - kubectl config use-context ${AGENT}
    - kubectl config set-context --current --namespace=${NS}
  script:
    - git clone https://gitlab.ebi.ac.uk/ensembl-web/ensembl-k8s-manifests.git
    - git -C ensembl-k8s-manifests/ checkout k8s123-migration
    - sed -i "s#<NFS_SERVER>#${NFS_SERVER}#g" ${BASE}/deployment.yaml
    - sed -i "s#<NFS_PATH>#${NFS_PATH}#g" ${BASE}/deployment.yaml
    - cd ensembl-k8s-manifests/ensembl-web-resolver
    - kustomize edit set image DOCKER_IMAGE=${DOCKER_IMAGE}
    - kubectl apply -k ./

.deploy_rules:
  rules:
    - if: '$CI_DEPLOY_FREEZE == null && $CI_COMMIT_BRANCH == "main"'
      when: on_success

# Build docker image for all branches
build:
  extends: .build
  needs: ["Test"]

# Prod:WP40:HL:
Prod:
  extends:
    - .deploy
    - .deploy_rules
  environment:
    name: production
  variables:
    AGENT: ${PROD_AGENT}
    NS: ${PROD_NS}

# Setup Review app in its own namespace named by branch name (CI_COMMIT_REF_SLUG)
Setup:Review:
  stage: setup
  image: dockerhub.ebi.ac.uk/ensembl-web/deploy-tools:latest
  environment:
    name: development
  script:
    - kubectl create namespace ${CI_COMMIT_REF_SLUG} --dry-run=client -o yaml | kubectl apply -f -
    - kubectl create configmap metadata-api-configmap --from-env-file=.env.sample --dry-run=client -o yaml | kubectl apply -f -
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" &&
        $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000" &&
        $CI_COMMIT_REF_NAME !~  "/^nodeploy\/.*$/"
      when: always

# Run Tests
Test:
  stage: test
  image: python:3.10
  before_script:
    # `fm_py` is in GitLab project 6228's private PyPI registry. pip picks up
    # these credentials automatically for the extra index below.
    - |
      umask 077
      printf 'machine gitlab.ebi.ac.uk\nlogin gitlab-ci-token\npassword %s\n' "$CI_JOB_TOKEN" > ~/.netrc
    - pip install --extra-index-url "${CI_API_V4_URL}/projects/6228/packages/pypi/simple" -r requirements.txt
    - cd app/
    - cp ../sample-env .env
  script:
    - python -m unittest
  artifacts:
    when: always

#Review:WP51:HL:
Review:
  extends: .deploy
  environment:
    name: development
  rules:
    - if: '$CI_DEPLOY_FREEZE == null && $CI_COMMIT_BRANCH != "dev"  && $CI_COMMIT_BRANCH != "main"'
      when: on_success
  variables:
    AGENT: ${REVIEW_AGENT}
    NS: ${CI_COMMIT_REF_SLUG}

#Prod:WP41:HX:
Fallback:
  extends:
    - .deploy
    - .deploy_rules
  environment:
    name: fallback
  variables:
    AGENT: ${FALLBACK_AGENT}
    NS: ${FALLBACK_NS}
    NFS_SERVER: ${HX_NFS_SERVER_CODON}
    NFS_PATH: ${HX_NFS_PATH_CODON}

# Dev: dev-2020.ensembl.org
Dev:
  extends:
    - .deploy
    - .deploy_rules
  environment:
    name: development
  variables:
    AGENT: ${DEV_AGENT}
    NS: ${DEV_NS}
